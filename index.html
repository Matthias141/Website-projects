<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EMMIT FENN — GODFORM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f0f0f0;cursor:none;font-family:monospace}
canvas{display:block}
#hud{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  color:#111;font-size:12px;letter-spacing:5px;
  pointer-events:none;z-index:50;
}
#status{
  position:fixed;bottom:14px;left:18px;color:#333;
  font-size:11px;letter-spacing:1px;pointer-events:none;z-index:50;
}
#cursor{
  position:fixed;width:14px;height:14px;border:1.5px solid #ff2d9b;
  border-radius:50%;pointer-events:none;z-index:60;
  transform:translate(-50%,-50%);
}
</style>
</head>
<body>
<div id="hud">EMMIT FENN — FAR FROM HERE // GODFORM</div>
<div id="status">LOADING</div>
<div id="cursor"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8.5, 5.5, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xf0f0f0, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0.7, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(10, 14, 8);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(-8, 6, -5);
scene.add(fill);

// Materials
const M = {
  red:     new THREE.MeshStandardMaterial({ color: 0xe6392b, roughness: 0.35, metalness: 0.15 }),
  green:   new THREE.MeshStandardMaterial({ color: 0x2a9d4a, roughness: 0.35, metalness: 0.15 }),
  white:   new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.25, metalness: 0.2 }),
  black:   new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.25 }),
  blue:    new THREE.MeshStandardMaterial({ color: 0x1e6fff, roughness: 0.3, metalness: 0.2 }),
  yellow:  new THREE.MeshStandardMaterial({ color: 0xffd60a, roughness: 0.3, metalness: 0.1 }),
  magenta: new THREE.MeshStandardMaterial({ color: 0xff2d9b, roughness: 0.3, metalness: 0.2 }),
  cyan:    new THREE.MeshStandardMaterial({ color: 0x00c8ff, roughness: 0.3, metalness: 0.25 }),
  chrome:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0.85 })
};

// ── SCULPTURE ──
const god = new THREE.Group();
scene.add(god);

// Spine
const cylR = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.45, 48), M.red);
cylR.position.set(0, 3.5, 0);
god.add(cylR);

const cylG = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 0.5, 48), M.green);
cylG.position.set(0, 2.95, 0);
god.add(cylG);

const cylW = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, 1.05, 48), M.white);
cylW.position.set(0, 2.1, 0);
god.add(cylW);

const core = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.55, 1.55), M.black);
core.position.set(0, 1.35, 0);
god.add(core);

const heart = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.85, 1.05), M.blue);
heart.position.set(0.5, 0.65, -0.15);
heart.rotation.z = -0.28;
god.add(heart);

// Lower
const yBody = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.65, 2.1), M.yellow);
yBody.position.set(-1.75, -0.45, 0.25);
god.add(yBody);

const yWing = new THREE.Mesh(new THREE.BoxGeometry(0.65, 1.5, 2.1), M.yellow);
yWing.position.set(-2.8, 0.2, 0.25);
god.add(yWing);

const rShell = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.95, 2.5), M.red);
rShell.position.set(-1.85, -0.8, 0.2);
god.add(rShell);

// Magenta plates
for (let i = 0; i < 7; i++) {
  const p = new THREE.Mesh(
    new THREE.BoxGeometry(1.4 + Math.random()*0.8, 0.11, 1.6 + Math.random()*0.9),
    M.magenta
  );
  p.position.set(2.1 + Math.random()*1.3, 0.7 + Math.random()*1.8, -0.7 + Math.random()*1.8);
  p.rotation.set((Math.random()-0.5)*1.0, (Math.random()-0.5)*1.3, (Math.random()-0.5)*1.0);
  p.userData = { base: p.position.clone(), phase: Math.random()*6.28, speed: 0.25 + Math.random()*0.6 };
  god.add(p);
}

// Rainbow prism
const soul = new THREE.Group();
const colors = [0xff0044, 0xff6600, 0xffee00, 0x00cc44, 0x0088ff, 0xaa22ff];
for (let i = 0; i < 6; i++) {
  const s = new THREE.Mesh(
    new THREE.BoxGeometry(0.17, 1.4, 0.65),
    new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.25, metalness: 0.3 })
  );
  s.position.x = (i - 2.5) * 0.18;
  soul.add(s);
}
soul.position.set(0.85, -1.05, 0.85);
soul.rotation.set(0.35, 0.65, -0.25);
god.add(soul);

// Eye
const eye = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.11, 16, 48), M.chrome);
eye.position.set(0.85, 0.05, 0.95);
eye.rotation.set(1.05, 0.35, 0.15);
god.add(eye);

// Black shard
const shard = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.7, 0.45), M.black);
shard.position.set(-0.55, 0.35, -1.2);
shard.rotation.set(0.18, 0.45, -0.35);
god.add(shard);

// Debris
for (let i = 0; i < 28; i++) {
  const s = 0.12 + Math.random() * 0.35;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(s, s * (0.35 + Math.random()*0.5), s),
    [M.green, M.blue, M.yellow, M.cyan, M.magenta, M.red][i % 6]
  );
  m.position.set(
    (Math.random() - 0.5) * 9,
    (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 8
  );
  m.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
  m.userData = { phase: Math.random()*6.28, speed: 0.15 + Math.random()*0.4 };
  god.add(m);
}

// Particles
const COUNT = 600;
const pos = new Float32Array(COUNT * 3);
const col = new Float32Array(COUNT * 3);
const palette = [
  new THREE.Color(0xff2d9b),
  new THREE.Color(0x00c8ff),
  new THREE.Color(0xffcc00),
  new THREE.Color(0xaa44ff)
];

for (let i = 0; i < COUNT; i++) {
  pos[i*3]   = (Math.random()-0.5)*14;
  pos[i*3+1] = (Math.random()-0.5)*9;
  pos[i*3+2] = (Math.random()-0.5)*12;
  const c = palette[i % 4];
  col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));

const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.08,
  vertexColors: true,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
scene.add(particles);

// Post
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.3, 0.9);
composer.addPass(bloom);

// State
const mouse = new THREE.Vector2();
const cursor = document.getElementById('cursor');
const status = document.getElementById('status');
let t = 0;

window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});

function animate() {
  requestAnimationFrame(animate);
  t += 0.009;

  god.rotation.y = 0.35 + Math.sin(t * 0.22) * 0.12;
  god.rotation.x = -0.18 + Math.sin(t * 0.16) * 0.06;
  god.position.y = Math.sin(t * 0.55) * 0.25;

  god.children.forEach(c => {
    if (c.userData && c.userData.base) {
      const u = c.userData;
      c.position.x = u.base.x + Math.sin(t * u.speed + u.phase) * 0.3;
      c.position.y = u.base.y + Math.cos(t * u.speed * 0.7 + u.phase) * 0.35;
    }
  });

  const arr = particles.geometry.attributes.position.array;
  for (let i = 0; i < COUNT; i++) {
    arr[i*3]   += Math.sin(t * 0.5 + i) * 0.0015;
    arr[i*3+1] += Math.cos(t * 0.4 + i) * 0.001;
  }
  particles.geometry.attributes.position.needsUpdate = true;
  particles.rotation.y += 0.0008;

  status.textContent = `PARTICLES: ${COUNT}`;

  controls.update();
  composer.render();
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
